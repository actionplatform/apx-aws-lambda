AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Action Platform deploy proxy - grants deploy on an app and hands out short-lived credentials of that app's deploy role. No platform secret, no AWS key.

Parameters:
  IssuerUrl:
    Type: String
    Description: The platform's public url, the OIDC issuer (https://platform.example.com)
  Organization:
    Type: String
    Description: The organization slug this proxy serves
  Version:
    Type: String
    Default: "0.1.0"

Resources:
  Boundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ActionPlatformBoundary
      Description: Caps every execution role the proxy creates; edit to widen or narrow what apps may do.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${!aws:PrincipalTag/action-platform:prefix}*"
          - Sid: Tracing
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: "*"
          - Sid: OwnResources
            Effect: Allow
            Action:
              - s3:*
              - dynamodb:*
              - sqs:*
              - sns:*
              - lambda:InvokeFunction
            Resource:
              - "arn:aws:s3:::${aws:PrincipalTag/action-platform:prefix}-*"
              - "arn:aws:s3:::${aws:PrincipalTag/action-platform:prefix}-*/*"
              - !Sub "arn:aws:dynamodb:*:${AWS::AccountId}:table/${!aws:PrincipalTag/action-platform:prefix}-*"
              - !Sub "arn:aws:sqs:*:${AWS::AccountId}:${!aws:PrincipalTag/action-platform:prefix}-*"
              - !Sub "arn:aws:sns:*:${AWS::AccountId}:${!aws:PrincipalTag/action-platform:prefix}-*"
              - !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:${!aws:PrincipalTag/action-platform:prefix}*"
          - Sid: OwnSecrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource:
              - !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:${!aws:PrincipalTag/action-platform:prefix}/*"
              - !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/${!aws:PrincipalTag/action-platform:prefix}/*"

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: app
          AttributeType: S
      KeySchema:
        - AttributeName: app
          KeyType: HASH

  Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          ISSUER_URL: !Ref IssuerUrl
          ORGANIZATION: !Ref Organization
          TABLE: !Ref Table
          BOUNDARY_ARN: !Ref Boundary
          PROXY_VERSION: !Ref Version
          ACCOUNT_ID: !Ref AWS::AccountId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: sts:AssumeRole
              Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/action-platform/ap-deploy-*
            - Effect: Allow
              Action: iam:GetRole
              Resource:
                - !Sub arn:aws:iam::${AWS::AccountId}:role/ap-deploy-*
                - !Sub arn:aws:iam::${AWS::AccountId}:role/ap-exec-*
            - Effect: Allow
              Action:
                - iam:GetRole
                - iam:UpdateAssumeRolePolicy
                - iam:DeleteRole
                - iam:PutRolePolicy
                - iam:DeleteRolePolicy
                - iam:AttachRolePolicy
                - iam:DetachRolePolicy
                - iam:ListAttachedRolePolicies
                - iam:ListRolePolicies
                - iam:TagRole
              Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/action-platform/*
            - Effect: Allow
              Action: iam:CreateRole
              Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/action-platform/ap-deploy-*
            - Effect: Allow
              Action: iam:CreateRole
              Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/action-platform/ap-exec-*
              Condition:
                StringEquals:
                  iam:PermissionsBoundary: !Ref Boundary

Outputs:
  ProxyUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
  BoundaryArn:
    Value: !Ref Boundary
