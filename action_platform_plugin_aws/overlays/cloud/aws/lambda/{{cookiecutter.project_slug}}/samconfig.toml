version = 0.1

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "{{ cookiecutter.project_slug }}-dev"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
s3_prefix = "{{ cookiecutter.project_slug }}-dev"
parameter_overrides = "Stage=dev DomainName= DomainCertificateArn="
tags = "Project={{ cookiecutter.project_slug }} Environment=dev ManagedBy=sam"

[prod.deploy.parameters]
stack_name = "{{ cookiecutter.project_slug }}-prod"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "{{ cookiecutter.project_slug }}-prod"
parameter_overrides = "Stage=prod DomainName= DomainCertificateArn="
tags = "Project={{ cookiecutter.project_slug }} Environment=prod ManagedBy=sam"
