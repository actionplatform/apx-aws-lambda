AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: {{ cookiecutter.project_slug }} — ASGI app on Lambda behind an HTTP API

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  DomainName:
    Type: String
    Default: ''
    Description: Custom domain (api.example.com). Empty skips it.
  DomainCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for DomainName, same region. Empty skips the custom domain.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  HasCustomDomain: !Not [!Equals [!Ref DomainCertificateArn, '']]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]

Resources:
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: makefile
    Properties:
      LayerName: !Sub "${AWS::StackName}-deps"
      ContentUri: .
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: .
      Handler: lambda_handler.lambda_handler
      Runtime: python3.12
      Layers: [!Ref DepsLayer]
      Environment:
        Variables:
          SCOPE: !If [IsProd, production, development]
          API_STAGE: ""
      Events:
        Http:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: !If [IsProd, 90, 14]

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      RouteSettings:
        "$default":
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref DomainCertificateArn
          EndpointType: REGIONAL

  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref HttpApi.Stage

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CustomDomainTarget:
    Condition: HasCustomDomain
    Description: Point the DNS record for DomainName at this regional target
    Value: !GetAtt ApiDomainName.RegionalDomainName
