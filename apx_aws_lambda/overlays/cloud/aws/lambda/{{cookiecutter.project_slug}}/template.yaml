AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: {{ cookiecutter.project_slug }} — {{ cookiecutter.language }} web app on Lambda (Lambda Web Adapter) behind an HTTP API

Parameters:
  Stage:
    Type: String
    Default: dev
  DomainName:
    Type: String
    Default: ''
    Description: Custom domain (api.example.com). Empty skips it.
  DomainCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for DomainName, same region. Empty skips the custom domain.
  ExecutionRoleArn:
    Type: String
    Default: ''
    Description: An existing execution role (the deploy proxy creates one per app). Empty lets SAM create it.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  HasExecutionRole: !Not [!Equals [!Ref ExecutionRoleArn, '']]
  HasCustomDomain: !Not [!Equals [!Ref DomainCertificateArn, '']]

Globals:
  Function:
    Timeout: 30
{%- if cookiecutter.language in ["java", "kotlin"] %}
    MemorySize: 1024
{%- else %}
    MemorySize: 512
{%- endif %}
    Architectures: [arm64]

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      cfn-lint:
        config:
          ignore_checks: [E3031]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: .
{%- if cookiecutter.language == "go" %}
      Handler: bootstrap
      Runtime: provided.al2023
{%- else %}
      Handler: run.sh
{%- if cookiecutter.language == "python" %}
      Runtime: python3.12
{%- elif cookiecutter.language == "node" %}
      Runtime: nodejs22.x
{%- elif cookiecutter.language == "ruby" %}
      Runtime: ruby3.3
{%- else %}
      Runtime: java21
{%- endif %}
{%- endif %}
      Role: !If [HasExecutionRole, !Ref ExecutionRoleArn, !Ref AWS::NoValue]
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:25
      Environment:
        Variables:
          SCOPE: !Ref Stage
          PORT: "8080"
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /health
{%- if cookiecutter.language != "go" %}
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
{%- endif %}
{%- if cookiecutter.language in ["java", "kotlin"] %}
          AWS_LWA_ASYNC_INIT: "true"
          JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
{%- endif %}
      Events:
        Http:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: !If [IsProd, 90, 14]

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      RouteSettings:
        "$default":
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref DomainCertificateArn
          EndpointType: REGIONAL

  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: !Ref HttpApi.Stage

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CustomDomainTarget:
    Condition: HasCustomDomain
    Description: Point the DNS record for DomainName at this regional target
    Value: !GetAtt ApiDomainName.RegionalDomainName
