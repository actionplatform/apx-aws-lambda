[project]
name = "apx-aws-lambda"
version = "0.3.4"
description = "AWS Lambda for Action Platform: the aws/lambda deploy target (SAM) with its overlay, and tools to read stacks and functions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Action Platform", email = "cloud@actionplatform.io" }]
dependencies = ["action-platform>=0.17.9", "awscli>=1.34", "aws-sam-cli>=1.120"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "action-platform[mcp]", "boto3>=1.34", "cryptography>=42"]

[project.entry-points."action_platform.plugins"]
aws-lambda = "apx_aws_lambda:AwsLambdaPlugin"

[project.entry-points."action_platform.deploy_target"]
"aws/lambda" = "apx_aws_lambda.lambda_:LambdaTarget"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apx_aws_lambda*"]

[tool.setuptools.package-data]
apx_aws_lambda = ["overlays/**/*", "overlays/**/.*", "overlays/**/.github/workflows/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "proxy/tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["apx_aws_lambda/overlays"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
