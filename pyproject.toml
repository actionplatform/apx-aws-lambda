[project]
name = "action-platform-plugin-aws"
version = "0.1.0"
description = "AWS for Action Platform: deploy targets and overlays for Lambda (SAM) and Amplify Hosting, plus tools to read what is deployed."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Action Platform", email = "cloud@actionplatform.io" }]
dependencies = ["action-platform>=0.16"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "action-platform[mcp]"]

[project.entry-points."action_platform.plugins"]
aws = "action_platform_plugin_aws:AwsPlugin"

[project.entry-points."action_platform.deploy_target"]
"aws/lambda" = "action_platform_plugin_aws.lambda_:LambdaTarget"
"aws/amplify" = "action_platform_plugin_aws.amplify:AmplifyTarget"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["action_platform_plugin_aws*"]

[tool.setuptools.package-data]
action_platform_plugin_aws = ["overlays/**/*", "overlays/**/.*", "overlays/**/.github/workflows/*"]

[tool.ruff]
line-length = 88
